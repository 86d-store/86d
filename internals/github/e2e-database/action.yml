name: E2E database bootstrap
description: Create nanoid helper, apply Drizzle migrations, and seed demo data

runs:
  using: composite
  steps:
    - name: Create nanoid function
      shell: bash
      env:
        PGPASSWORD: postgres
      run: psql -h localhost -U postgres -d 86d -f "${{ github.action_path }}/nanoid.sql"

    - name: Apply database migrations
      shell: bash
      run: bun run db:migrate

    - name: Seed database
      shell: bash
      run: bun run db:seed
