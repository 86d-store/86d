name: Update visual snapshots
description: Regenerate Playwright visual snapshots locally without publishing

runs:
  using: composite
  steps:
    - name: Install Playwright Chromium
      shell: bash
      run: bunx playwright install --with-deps chromium

    - name: Regenerate visual snapshots
      shell: bash
      run: bunx playwright test visual.spec.ts merchant-ui-fixtures.spec.ts --config tests/playwright.config.ts --update-snapshots=all
