name: E2E store server
description: Install Playwright, build the store, and start the production server

runs:
  using: composite
  steps:
    - name: Install Playwright
      shell: bash
      run: bunx playwright install --with-deps chromium

    - name: Build store
      shell: bash
      env:
        E2E_MERCHANT_UI_FIXTURES: "true"
      run: bun run build:store

    - name: Start store server
      shell: bash
      env:
        E2E_MERCHANT_UI_FIXTURES: "true"
      run: |
        cd apps/store && bun run start &
        echo $! > /tmp/store.pid
        bunx wait-on tcp:127.0.0.1:3000 --timeout 120000
