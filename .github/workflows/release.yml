name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  release:
    name: Release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Pin publish to this environment; set the same name on each npm trusted publisher.
    # Create Settings → Environments → npm-publish with required reviewers before relying on OIDC.
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # changesets needs full history for changelogs and publish decisions
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup
        uses: ./internals/github/setup

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Shared version line is owned by `bun run bump-version` (see AGENTS.md).
          # Pending .changeset files still drive the Version PR / changelog path;
          # with none pending, this step publishes any versions ahead of npm.
          version: bun run version-packages
          publish: bun run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publish auth is npm trusted publishing (OIDC) against environment npm-publish.
          NPM_CONFIG_PROVENANCE: "true"
