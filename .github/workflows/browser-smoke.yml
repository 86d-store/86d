name: Browser smoke

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/browser-smoke.yml"
      - ".env.example"
      - "apps/store/**"
      - "internals/github/browser-database/**"
      - "internals/github/copy-env/**"
      - "internals/github/setup/**"
      - "internals/github/browser-store/**"
      - "modules/**"
      - "packages/**"
      - "templates/**"
      - "tests/browser/**"
      - "tests/playwright.config.ts"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/browser-smoke.yml"
      - ".env.example"
      - "apps/store/**"
      - "internals/github/browser-database/**"
      - "internals/github/copy-env/**"
      - "internals/github/setup/**"
      - "internals/github/browser-store/**"
      - "modules/**"
      - "packages/**"
      - "templates/**"
      - "tests/browser/**"
      - "tests/playwright.config.ts"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  BETTER_AUTH_SECRET: ci-test-secret-not-for-production

jobs:
  browser-smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: 86d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/86d
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/86d
      BROWSER_STORE_URL: http://127.0.0.1:3000
      BROWSER_ADMIN_PASSWORD: abc12321
      BROWSER_MERCHANT_UI_FIXTURES: "true"
      STORAGE_CLIENT: local
      STORAGE_LOCAL_DIR: ${{ github.workspace }}/uploads
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_STORE_URL: http://127.0.0.1:3000
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./internals/github/setup

      - name: Copy env
        uses: ./internals/github/copy-env

      - name: Bootstrap browser database
        uses: ./internals/github/browser-database

      - name: Start production store
        id: browser-store
        uses: ./internals/github/browser-store

      - name: Browser smoke
        run: bun test:browser

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-smoke-artifacts
          path: |
            browser-report/
            browser-results/
          if-no-files-found: warn
